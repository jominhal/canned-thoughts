<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This can is empty — Canned Thoughts</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08090f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥫</text></svg>">
<style>
  :root{ --ink:#08090f; --paper:#f2ecdd; --dim:#b3ab99; --amber:#e8a33d; --coral:#ff6a4d; --line:#272d40;
    --serif: Georgia, "Times New Roman", serif; --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ink);color:var(--paper);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 22px}
  main{max-width:560px;text-align:left}
  .can{font-size:4.2rem;line-height:1;margin-bottom:22px}
  h1{font-family:var(--serif);font-weight:700;font-size:clamp(2.4rem,7vw,3.6rem);line-height:1.05;letter-spacing:-.02em;margin-bottom:14px}
  h1 span{color:var(--amber)}
  p{color:var(--dim);font-size:1.05rem;margin-bottom:30px;max-width:480px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  a.btn{display:inline-flex;align-items:center;min-height:48px;padding:12px 24px;border-radius:999px;font-weight:700;font-size:.95rem;
    border:1px solid var(--amber);color:var(--paper);text-decoration:none;transition:transform .18s ease, background .18s ease}
  a.btn.solid{background:linear-gradient(135deg,var(--amber),var(--coral));color:#221503;border:none}
  a.btn:hover{transform:translateY(-2px);text-decoration:none}
  a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
  ::selection{background:var(--amber);color:#221503}
</style>
</head>
<body>
<main>
  <div class="can" aria-hidden="true">🥫</div>
  <h1>this can is <span>empty.</span></h1>
  <p>Whatever was shelved at this address has been opened, read, and taken home by somebody else. The rest of the shelf is still stocked.</p>
  <div class="row">
    <a class="btn solid" href="/canned-thoughts/">Back to the shelf</a>
    <a class="btn" href="/canned-thoughts/jokes.html">😂 The joke book</a>
  </div>
</main>
</body>
</html>
